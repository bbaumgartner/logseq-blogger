[project]
name = "logseq-blogger"
version = "0.2.0"
description = "Use Logseq as a blog editor: extract type::blog posts and hand them off via the syndicate interface (SFTP + n8n webhooks)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "paramiko>=3.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
logseq-blogger = "logseq_blogger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logseq_blogger"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
